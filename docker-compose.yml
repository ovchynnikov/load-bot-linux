services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-video-bot
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - bot-data:/bot/data  # Persistent storage for SQLite database
      # Optional cookie files (must be writable: yt-dlp saves the cookie jar back):
      # - ./instagram_cookies.txt:/bot/instagram_cookies.txt
      # - ./reddit_cookies.txt:/bot/reddit_cookies.txt
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

volumes:
  bot-data:
    driver: local
